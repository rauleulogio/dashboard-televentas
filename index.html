<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de KPI - Televentas</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --border: #334155;
        }

        body.light-mode {
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-color: #0f172a;
            --text-muted: #64748b;
            --accent: #0284c7;
            --border: #cbd5e1;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            transition: background 0.3s, color 0.3s;
        }

        .header-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            background: var(--card-bg);
            padding: 15px 20px;
            border-radius: 12px;
            border: 1px solid var(--border);
        }

        .update-info {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        button {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            opacity: 0.9;
        }

        .table-container {
            background: var(--card-bg);
            border-radius: 12px;
            border: 1px solid var(--border);
            overflow-x: auto;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th, td {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
        }

        th {
            background-color: rgba(0, 0, 0, 0.05);
            font-weight: 600;
        }

        tr:last-child td {
            border-bottom: none;
        }
    </style>
</head>
<body>

    <div class="header-container">
        <div>
            <h2>Panel de Control - KPI</h2>
            <div class="update-info">Última sincronización de datos: <span id="horaActualizacion">Cargando...</span></div>
        </div>
        <div>
            <button id="themeBtn" onclick="toggleTheme()">☀️ Modo Claro</button>
        </div>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Agente</th>
                    <th>Activas</th>
                    <th>En Progreso</th>
                    <th>Canceladas</th>
                    <th>Proyección</th>
                </tr>
            </thead>
            <tbody id="cuerpoTabla">
                <tr>
                    <td colspan="5" style="text-align: center; color: var(--text-muted);">Conectando con la base de datos...</td>
                </tr>
            </tbody>
        </table>
    </div>

    <script>
        const API_URL = "https://sheetdb.io/api/v1/bop8vqmouwjlx";

        function cargarDatosKPI() {
            fetch(API_URL)
                .then(response => {
                    if (!response.ok) throw new Error("Error en la red");
                    return response.json();
                })
                .then(data => {
                    const tbody = document.getElementById('cuerpoTabla');
                    tbody.innerHTML = ""; 

                    if (!data || data.length === 0) {
                        tbody.innerHTML = `<tr><td colspan="5" style="text-align: center;">No hay registros disponibles en el Excel.</td></tr>`;
                        return;
                    }

                    data.forEach(fila => {
                        // Lee directamente las columnas exactas de tu Excel
                        const agente = fila['AGENTE'];
                        
                        // Si la fila está vacía o es una cabecera repetida, la salta
                        if (!agente || agente.trim() === "" || agente.toLowerCase().includes("agente")) return;

                        const activas = fila['ACTIVAS'] !== undefined ? fila['ACTIVAS'] : '0';
                        const enProgreso = fila['EN PROGRESO'] !== undefined ? fila['EN PROGRESO'] : '0';
                        const canceladas = fila['CANCELADAS'] !== undefined ? fila['CANCELADAS'] : '0';
                        const proyeccion = fila['PROYECCIÓN'] !== undefined ? fila['PROYECCIÓN'] : (fila['PROYECCION'] !== undefined ? fila['PROYECCION'] : '0');

                        const tr = document.createElement('tr');
                        tr.innerHTML = `
                            <td>${agente}</td>
                            <td>${activas}</td>
                            <td>${enProgreso}</td>
                            <td>${canceladas}</td>
                            <td>${proyeccion}</td>
                        `;
                        tbody.appendChild(tr);
                    });

                    if (tbody.innerHTML === "") {
                        tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: var(--text-muted);">Se conectó a SheetDB pero no se encontraron filas de agentes válidas.</td></tr>`;
                    }

                    const ahora = new Date();
                    const horaFormateada = ahora.toLocaleTimeString('es-PE', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
                    document.getElementById('horaActualizacion').textContent = horaFormateada;
                })
                .catch(err => {
                    console.error("Error de sincronización:", err);
                    document.getElementById('horaActualizacion').textContent = "Error de sincronización";
                });
        }

        window.onload = function() {
            cargarDatosKPI();
            setInterval(cargarDatosKPI, 60000); // Actualiza cada 1 minuto
        };

        function toggleTheme() {
            document.body.classList.toggle('light-mode');
            const btn = document.getElementById('themeBtn');
            if(document.body.classList.contains('light-mode')) {
                btn.innerHTML = "🌙 Modo Oscuro";
            } else {
                btn.innerHTML = "☀️ Modo Claro";
            }
        }
    </script>
</body>
</html>
