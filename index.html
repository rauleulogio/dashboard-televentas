<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de KPI - Televentas</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --border: #334155;
        }

        body.light-mode {
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-color: #0f172a;
            --text-muted: #64748b;
            --accent: #0284c7;
            --border: #cbd5e1;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            transition: background 0.3s, color 0.3s;
        }

        .header-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            background: var(--card-bg);
            padding: 15px 20px;
            border-radius: 12px;
            border: 1px solid var(--border);
        }

        .update-info {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        button {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            opacity: 0.9;
        }

        .table-container {
            background: var(--card-bg);
            border-radius: 12px;
            border: 1px solid var(--border);
            overflow-x: auto;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th, td {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
        }

        th {
            background-color: rgba(0, 0, 0, 0.05);
            font-weight: 600;
        }

        tr:last-child td {
            border-bottom: none;
        }
    </style>
</head>
<body>

    <div class="header-container">
        <div>
            <h2>Panel de Control - KPI</h2>
            <div class="update-info">Última sincronización de datos: <span id="horaActualizacion">Cargando...</span></div>
        </div>
        <div>
            <button id="themeBtn" onclick="toggleTheme()">☀️ Modo Claro</button>
        </div>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Agente</th>
                    <th>En Progreso</th>
                    <th>Cerrados</th>
                    <th>Total</th>
                </tr>
            </thead>
            <tbody id="cuerpoTabla">
                <tr>
                    <td colspan="4" style="text-align: center; color: var(--text-muted);">Conectando con la base de datos...</td>
                </tr>
            </tbody>
        </table>
    </div>

    <script>
        // ENLACE PROXY CORS INTEGRADO PARA EVITAR BLOQUEOS
        const API_URL = "https://api.allorigins.win/raw?url=" + encodeURIComponent("https://api.sheetbest.com/sheets/1f57e554-8744-418a-b037-d1d744b36008");

        function cargarDatosKPI() {
            fetch(API_URL)
                .then(response => {
                    if (!response.ok) throw new Error("Error en la red");
                    return response.json();
                })
                .then(data => {
                    const tbody = document.getElementById('cuerpoTabla');
                    tbody.innerHTML = ""; 

                    if (!data || data.length === 0) {
                        tbody.innerHTML = `<tr><td colspan="4" style="text-align: center;">No hay registros disponibles.</td></tr>`;
                        return;
                    }

                    data.forEach(fila => {
                        const tr = document.createElement('tr');
                        tr.innerHTML = `
                            <td>${fila['AGENTE'] || ''}</td>
                            <td>${fila['EN PROGRESO'] || '0'}</td>
                            <td>${fila['CERRADOS'] || '0'}</td>
                            <td>${fila['TOTAL'] || '0'}</td>
                        `;
                        tbody.appendChild(tr);
                    });

                    const ahora = new Date();
                    const horaFormateada = ahora.toLocaleTimeString('es-PE', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
                    document.getElementById('horaActualizacion').textContent = horaFormateada;
                })
                .catch(err => {
                    console.error("Error de sincronización:", err);
                    document.getElementById('horaActualizacion').textContent = "Error de sincronización";
                });
        }

        window.onload = function() {
            cargarDatosKPI();
            setInterval(cargarDatosKPI, 60000);
        };

        function toggleTheme() {
            document.body.classList.toggle('light-mode');
            const btn = document.getElementById('themeBtn');
            if(document.body.classList.contains('light-mode')) {
                btn.innerHTML = "🌙 Modo Oscuro";
            } else {
                btn.innerHTML = "☀️ Modo Claro";
            }
        }
    </script>
</body>
</html>
